<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打字速度测试 · Lab</title>
<link rel="stylesheet" href="style.css">
<style>
  .type-stage{position:relative;cursor:text}
  #input{
    position:absolute;left:0;top:0;width:1px;height:1px;
    opacity:0;border:0;padding:0;resize:none;
  }
  .typing-text{
    font-family:var(--mono);
    font-size:clamp(17px,2.6vw,21px);
    line-height:1.95;
    letter-spacing:.005em;
    color:#565248;
    user-select:none;
    word-break:break-word;
    white-space:pre-wrap;
    min-height:120px;
  }
  .typing-text .ok{color:var(--text)}
  .typing-text .bad{color:var(--bad);background:rgba(255,107,92,.16);border-radius:2px}
  .typing-text .cur{
    color:var(--text);
    background:rgba(212,175,87,.16);
    box-shadow:inset 0 -2px 0 var(--gold);
    animation:caret 1s steps(1) infinite;
  }
  @keyframes caret{
    50%{box-shadow:inset 0 -2px 0 transparent;background:rgba(212,175,87,.05)}
  }

  .type-bar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:20px}
  .type-bar .stats{margin-left:auto}
  .result{
    margin-top:22px;padding-top:20px;border-top:1px solid var(--line);
    display:none;
  }
  .result.show{display:block}
  .result-line{font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:14px}
  .result-line b{color:var(--gold);font-size:15px}
  .idle-tip{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .flash{animation:flash .4s ease}
  @keyframes flash{0%{opacity:.3}100%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">L</span>
      <span class="brand-name"><b>Lab</b> · typing</span>
    </a>
    <nav>
      <a href="index.html">← 全部工具</a>
      <a href="../index.html">作品集</a>
    </nav>
  </div>

  <div class="eyebrow">60 秒 · 英文 · 本地记录</div>
  <h1>打字<em>速度测试</em></h1>
  <p class="lede">点下面的文字开始，输入速度实时计算。打错了不用管，继续往下打即可——错字会标红，但不会拦住你。时间到自动结算。</p>

  <div class="panel">
    <div class="type-bar">
      <button class="btn btn-primary" id="startBtn">开始 / 换一句</button>
      <span class="idle-tip" id="tip">等待开始</span>
      <div class="stats">
        <div class="stat"><b id="sTime">60</b><span>剩余秒</span></div>
        <div class="stat"><b id="sWpm">0</b><span>WPM</span></div>
        <div class="stat accent"><b id="sAcc">100%</b><span>准确率</span></div>
      </div>
    </div>

    <div class="type-stage" id="stage">
      <div class="typing-text" id="text" aria-hidden="true"></div>
      <textarea id="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="打字输入区"></textarea>
    </div>

    <div class="result" id="result">
      <div class="result-line" id="resultText"></div>
      <button class="btn" id="againBtn">再来一局</button>
    </div>
  </div>

  <div class="foot">
    <span>WPM = 正确字符数 ÷ 5 ÷ 分钟</span>
    <span>最佳成绩 <b id="best">—</b></span>
  </div>

</div>
<script src="typing.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048 · Lab</title>
<link rel="stylesheet" href="style.css">
<style>
  .game-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .game-top .stats{margin-left:auto}
  .score-box{
    font-family:var(--mono);text-align:right;padding:6px 14px;
    border:1px solid var(--line);border-radius:8px;min-width:88px;
  }
  .score-box span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .score-box b{font-size:19px;font-weight:600}

  .board{
    position:relative;
    width:100%;max-width:460px;margin:0 auto;
    aspect-ratio:1/1;
    background:#101012;
    border:1px solid var(--line);
    border-radius:12px;
    touch-action:none;
    user-select:none;
    overflow:hidden;
  }
  .cell{
    position:absolute;width:21.875%;height:21.875%;
    left:calc(2.5% + var(--c) * 24.375%);
    top:calc(2.5% + var(--r) * 24.375%);
    background:#17181b;border-radius:7px;
  }
  .tile{
    position:absolute;width:21.875%;height:21.875%;
    left:calc(2.5% + var(--c) * 24.375%);
    top:calc(2.5% + var(--r) * 24.375%);
    display:grid;place-items:center;
    border-radius:7px;
    font-family:var(--mono);font-weight:700;
    font-size:clamp(18px,5vw,30px);
    color:#161207;
    background:#e7d9b4;
    transition:left .13s ease,top .13s ease,background .15s ease;
    will-change:left,top;
  }
  .tile[data-v="2"]{background:#e8ddc2}
  .tile[data-v="4"]{background:#e3cf9d}
  .tile[data-v="8"]{background:#d9b96f;color:#1a1508}
  .tile[data-v="16"]{background:#d4af57}
  .tile[data-v="32"]{background:#c99f42;font-size:clamp(16px,4.4vw,27px)}
  .tile[data-v="64"]{background:#b98c2d;color:#fff8e6;font-size:clamp(16px,4.4vw,27px)}
  .tile[data-v="128"]{background:#a97c22;color:#fff8e6;font-size:clamp(14px,3.8vw,23px)}
  .tile[data-v="256"]{background:#96691a;color:#fff8e6;font-size:clamp(14px,3.8vw,23px)}
  .tile[data-v="512"]{background:#7f5613;color:#fff8e6;font-size:clamp(14px,3.8vw,23px)}
  .tile[data-v="1024"]{background:#67440e;color:#fff8e6;font-size:clamp(12px,3vw,19px)}
  .tile[data-v="2048"]{background:linear-gradient(145deg,#f0cf7a,#d4af57);color:#161207;font-size:clamp(12px,3vw,19px);box-shadow:0 0 22px rgba(212,175,87,.45)}
  .tile.big{font-size:clamp(12px,3vw,19px)}
  .tile.pop{animation:pop .16s ease}
  .tile.gone{animation:gone .16s ease forwards}
  @keyframes pop{0%{transform:scale(.55)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes gone{to{opacity:0;transform:scale(.7)}}

  .overlay{
    position:absolute;inset:0;display:none;
    place-items:center;text-align:center;
    background:rgba(10,10,11,.86);backdrop-filter:blur(4px);
    z-index:5;padding:20px;
  }
  .overlay.show{display:grid}
  .overlay h3{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
  .overlay p{margin:0 0 16px;color:var(--muted);font-size:13.5px;font-family:var(--mono)}
  .pad-tip{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:16px;text-align:center}
  @media (max-width:520px){ .pad-tip{font-size:11px} }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">L</span>
      <span class="brand-name"><b>Lab</b> · 2048</span>
    </a>
    <nav>
      <a href="index.html">← 全部工具</a>
      <a href="../index.html">作品集</a>
    </nav>
  </div>

  <div class="eyebrow">方向键 / WASD / 滑动</div>
  <h1>2048</h1>
  <p class="lede">同值合并，目标 2048。走错一步可以撤销一次，最高分存在本地。</p>

  <div class="panel">
    <div class="game-top">
      <button class="btn" id="undoBtn" disabled>↶ 撤销</button>
      <button class="btn btn-primary" id="newBtn">新局</button>
      <div class="stats">
        <div class="score-box"><span>分数</span><b id="score">0</b></div>
        <div class="score-box"><span>最高</span><b id="best">0</b></div>
      </div>
    </div>

    <div class="board" id="board" tabindex="0" aria-label="2048 棋盘">
      <div class="overlay" id="overlay">
        <div>
          <h3 id="ovTitle">游戏结束</h3>
          <p id="ovText">没有可走的步了</p>
          <button class="btn btn-primary" id="ovBtn">再来一局</button>
        </div>
      </div>
    </div>

    <p class="pad-tip">电脑：方向键或 WASD　·　手机：在棋盘上滑动</p>
  </div>

  <div class="foot">
    <span>4×4 · 每次移动生成一个 2 或 4</span>
    <span><a href="index.html">← 全部工具</a></span>
  </div>

</div>
<script src="game2048.js"></script>
</body>
</html>

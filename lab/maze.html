<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迷宫生成与寻路 · Lab</title>
<link rel="stylesheet" href="style.css">
<style>
  .maze-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{
    font-family:var(--mono);font-size:12px;background:transparent;border:0;
    color:var(--muted);padding:8px 12px;cursor:pointer;transition:.16s;
  }
  .seg button + button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:rgba(212,175,87,.14);color:var(--gold)}
  .seg button:hover{color:var(--gold)}

  .maze-stage{display:grid;place-items:center}
  canvas{
    width:100%;max-width:560px;height:auto;display:block;
    border-radius:10px;background:#0f1012;
    touch-action:manipulation;
  }
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:16px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .lg-bfs{background:rgba(78,140,255,.75)}
  .lg-astar{background:rgba(212,175,87,.85)}
  .lg-path{background:#fff6de}

  .compare{display:flex;gap:26px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
  .compare .stat b{font-size:19px}
  .compare .stat span{text-transform:none;letter-spacing:.02em}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">L</span>
      <span class="brand-name"><b>Lab</b> · maze</span>
    </a>
    <nav>
      <a href="index.html">← 全部工具</a>
      <a href="../index.html">作品集</a>
    </nav>
  </div>

  <div class="eyebrow">DFS 生成 · BFS vs A*</div>
  <h1>迷宫<em>生成与寻路</em></h1>
  <p class="lede">
    递归回溯挖出一座迷宫，再随机打通少量内墙形成回路，然后让两种算法在同一张图上各跑一遍。
    回路越多，A* 靠"离终点还有多远"这个启发式省下的格子就越明显。
  </p>

  <div class="panel">
    <div class="maze-controls">
      <div class="seg" role="group" aria-label="迷宫尺寸">
        <button data-size="15" aria-pressed="false">15×15</button>
        <button data-size="21" aria-pressed="true">21×21</button>
        <button data-size="31" aria-pressed="false">31×31</button>
      </div>
      <button class="btn" id="genBtn">重新生成</button>
      <button class="btn btn-primary" id="solveBtn">开始寻路</button>
      <div class="stats" style="margin-left:auto">
        <div class="stat"><b id="sVisited">—</b><span>A* 访问</span></div>
        <div class="stat accent"><b id="sSteps">—</b><span>路径步数</span></div>
      </div>
    </div>

    <div class="maze-stage">
      <canvas id="cv" width="1000" height="1000" aria-label="迷宫"></canvas>
    </div>

    <div class="legend">
      <span><i class="lg-bfs"></i>BFS 访问</span>
      <span><i class="lg-astar"></i>A* 访问</span>
      <span><i class="lg-path"></i>最短路径</span>
    </div>

    <div class="compare">
      <div class="stat"><b id="bfsCount">—</b><span>BFS 访问格数</span></div>
      <div class="stat"><b id="astarCount">—</b><span>A* 访问格数</span></div>
      <div class="stat"><b id="saved">—</b><span>A* 少看</span></div>
    </div>
  </div>

  <div class="foot">
    <span>递归回溯生成 · 额外打通约 5% 内墙做回路</span>
    <span><a href="index.html">← 全部工具</a></span>
  </div>

</div>
<script src="maze.js"></script>
</body>
</html>
